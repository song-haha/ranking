<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4개 학급 영상 비교 평가</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#102044;background:#f3f7ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(115deg,#0868ed 0%,#2555f4 52%,#7234ed 100%);color:white;padding:25px 30px;border-radius:22px 22px 0 0}h1{font-size:clamp(22px,4vw,32px);margin:8px 0}h2{font-size:21px;margin:0 0 8px}p{color:#536583;line-height:1.6}.pill{background:#ffffff32;border:1px solid #ffffff70;color:white;padding:8px 12px;border-radius:40px;white-space:nowrap;font-weight:800}.progress{height:9px;background:#d9e3f5;border-radius:20px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#009e77,#2acb89);transition:width .2s}.tabs{display:flex;background:#dce7ff;padding:5px;border-radius:0 0 16px 16px;margin-bottom:22px;gap:5px}.tabs button{flex:1;border:0;background:transparent;padding:15px;border-radius:11px;font-weight:800;color:#24438c;cursor:pointer;font-size:15px}.tabs button.active{background:white;color:#1249d5;box-shadow:0 3px 10px #1c46af28}.section{margin:22px 0 30px;background:#fff;border:1px solid #cbdcfb;border-radius:18px;padding:20px}.section>h2{padding:12px 15px;border-radius:12px;background:#e5efff;color:#1153c7}.section:nth-child(2)>h2{background:#dcf9e9;color:#07834d}.section:nth-child(3)>h2{background:#fff0c6;color:#c45a00}.section:nth-child(4)>h2{background:#ffe1f2;color:#c52180}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card,.result{background:white;border:1px solid #c9d8f2;border-radius:15px;padding:20px;box-shadow:0 4px 12px #153e9410}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.card-head strong{display:inline-block;background:#087af4;color:white;border-radius:9px;padding:7px 15px}.card:nth-child(2) .card-head strong{background:#13ae43}.card:nth-child(3) .card-head strong{background:#ff9700}.card:nth-child(4) .card-head strong{background:#853cd5}.score{font-size:13px;color:#536583;font-weight:700}.scale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.scale button{min-height:44px;border:1px solid #bdccec;background:#f4f7ff;border-radius:9px;font-weight:800;cursor:pointer;font-size:16px;color:#132c5e}.scale button:hover{border-color:#3569f5;background:#e6edff}.scale button.selected{background:#2359f1;color:white;border-color:#2359f1;box-shadow:0 2px 8px #2659f34d}label{display:block;font-size:13px;font-weight:800;margin:16px 0 7px}textarea{width:100%;resize:vertical;min-height:70px;padding:11px;border:1px solid #b9c9e8;border-radius:10px;font:inherit;font-size:14px}textarea:focus{outline:2px solid #477cff}.legend{font-size:13px;color:#173d86;background:#e0ebff;padding:15px;border-radius:12px;font-weight:650}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}button.primary,button.secondary{border:0;border-radius:11px;padding:15px 22px;font-weight:800;cursor:pointer;font-size:15px}.primary{background:linear-gradient(110deg,#4732ed,#6627cb);color:white}.primary:disabled{background:#9cacc9;cursor:not-allowed}.secondary{background:#e6edff;color:#234dc8;border:1px solid #a8bbfa}.result{margin:15px 0;border-width:2px}.result:nth-child(1){border-color:#9ac4ff;background:linear-gradient(90deg,#e1efff,#fff 40%)}.result:nth-child(2){border-color:#9be6bd;background:linear-gradient(90deg,#dcfae8,#fff 40%)}.result:nth-child(3){border-color:#ffdf87;background:linear-gradient(90deg,#fff0c2,#fff 40%)}.result:nth-child(4){border-color:#ffc0e3;background:linear-gradient(90deg,#ffe0f1,#fff 40%)}.result:nth-child(1) h2{color:#095cdd}.result:nth-child(2) h2{color:#069b57}.result:nth-child(3) h2{color:#e56a00}.result:nth-child(4) h2{color:#d32d89}.rankrow{display:grid;grid-template-columns:50px 1fr 48px;gap:12px;align-items:center;margin:16px 0;background:#ffffffc9;padding:9px 12px;border-radius:11px}.rank{font-weight:800}.bar{height:11px;background:#e1e8f4;border-radius:20px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:linear-gradient(90deg,#79b9ff,#087cf2);border-radius:20px}.result:nth-child(2) .bar>div{background:linear-gradient(90deg,#7fe2b0,#00a36b)}.result:nth-child(3) .bar>div{background:linear-gradient(90deg,#ffd56b,#ff8b00)}.result:nth-child(4) .bar>div{background:linear-gradient(90deg,#ffa2d3,#e52d91)}.rankrow.top .rank{color:#5030d7}.memo-group{background:#fff;border:2px solid #cbdcfb;border-radius:18px;padding:18px;margin:16px 0}.memo-group:nth-child(2){border-color:#9ac4ff}.memo-group:nth-child(3){border-color:#9be6bd}.memo-group:nth-child(4){border-color:#ffdf87}.memo-group:nth-child(5){border-color:#ffc0e3}.memo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.memo-item{background:#f4f7ff;border-radius:12px;padding:15px;min-width:0}.memo-item strong{display:block;color:#1458d9;margin-bottom:8px}.memo-item p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.memo-empty{color:#8290a8!important;font-style:italic}.hidden{display:none}#message{color:#ba2744;font-size:14px;margin-top:10px}@media(max-width:650px){.wrap{padding:0 0 55px}header{border-radius:0;padding:22px 16px}.tabs{border-radius:0 0 14px 14px;margin:0 12px 18px}#eval,#result,#memo{padding:0 12px}.memo-grid{grid-template-columns:1fr}.tabs button{font-size:13px;padding:13px 5px}.cards{grid-template-columns:1fr}.section{padding:13px}.card{padding:15px}.actions{flex-direction:column}.actions button{width:100%}.rankrow{grid-template-columns:43px 1fr 42px;gap:8px}.scale{gap:4px}.scale button{min-height:42px}}

@page{size:A4;margin:16mm 14mm}
@media print{
 :root{background:#fff;color:#102044;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:white!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .wrap{max-width:none;padding:0}
 header{border-radius:10px;padding:15px 20px;margin-bottom:16px}
 header h1{font-size:21px}
 .pill,.progress,.tabs,.actions{display:none!important}
 #eval{display:none!important}
 body.print-result #result,body.print-memo #memo{display:block!important;padding:0!important}
 body.print-result #memo,body.print-memo #result{display:none!important}
 .result,.memo-group{break-inside:avoid;page-break-inside:avoid;margin:12px 0;padding:13px}
 .result h2,.memo-group h2{font-size:17px}
 .rankrow{margin:8px 0;padding:7px 10px}
 .memo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .memo-item{break-inside:avoid;page-break-inside:avoid}
 p{font-size:12px}
}
</style></head><body><main class="wrap"><header><div><div style="font-size:13px;color:#ffffff;font-weight:800">영상 평가 도구</div><h1>4개 학급 영상 비교 평가</h1></div><span class="pill" id="counter">0 / 16</span></header><div class="progress"><div class="fill" id="progress"></div></div><nav class="tabs"><button id="tab-eval" class="active" onclick="show('eval')">평가 입력</button><button id="tab-result" onclick="show('result')">결과 및 순위</button><button id="tab-memo" onclick="show('memo')">학생 메모 정리</button></nav><section id="eval"><p>각 학급의 영상을 1~6점으로 평가하고, 필요한 경우 메모를 작성하세요.</p><div class="legend">1 전혀 그렇지 않다 · 2 그렇지 않다 · 3 약간 그렇지 않다 · 4 약간 그렇다 · 5 그렇다 · 6 매우 그렇다</div><div id="questions"></div><div class="actions"><button class="secondary" onclick="resetAll()">입력 초기화</button><button class="primary" id="submit" onclick="submitResults()" disabled>평가 제출 및 결과 보기</button></div><div id="message" aria-live="polite"></div></section><section id="result" class="hidden"><h2>항목별 학급 순위</h2><p>각 항목의 6점 만점 평가 결과를 높은 점수순으로 정렬했습니다. 동점은 공동 순위로 표시합니다.</p><div id="rankings"></div><div class="actions"><button class="secondary" onclick="show('eval')">평가 수정</button><button class="secondary" onclick="savePdf('result')">📄 결과 PDF 저장</button><button class="primary" onclick="copyResults()">결과 복사</button></div></section><section id="memo" class="hidden"><h2>학생 메모 정리</h2><p>평가 입력 화면에서 작성한 메모를 평가 항목별로 모아 학급별로 확인할 수 있습니다. 메모를 수정하면 이 화면에도 반영됩니다.</p><div id="memo-list"></div><div class="actions"><button class="secondary" onclick="show('eval')">메모 수정</button><button class="secondary" onclick="savePdf('memo')">📄 메모 PDF 저장</button><button class="primary" onclick="copyMemos()">메모 복사</button></div></section></main><script>
const classes=['2반','7반','9반','10반'];const criteria=[['내용 이해','이 영상은 학습 내용을 이해하는 데 도움이 되었다.'],['관심과 흥미 유발','이 영상은 학습 내용에 대한 관심과 흥미를 유발하였다.'],['몰입 유지','이 영상은 시청하는 동안 집중과 몰입을 유지하도록 하였다.'],['개성과 창의성 표현','이 영상은 제작자의 개성과 창의성을 효과적으로 표현하였다.']];
let scores={},notes={};try{scores=JSON.parse(localStorage.getItem('videoScores')||'{}');notes=JSON.parse(localStorage.getItem('videoNotes')||'{}')}catch(e){}const key=(i,j)=>`${i}-${j}`;function save(){localStorage.setItem('videoScores',JSON.stringify(scores));localStorage.setItem('videoNotes',JSON.stringify(notes))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('questions').innerHTML=criteria.map(([name,q],i)=>`<section class="section"><h2>${i+1}. ${name}</h2><p>${q}</p><div class="cards">${classes.map((cls,j)=>`<article class="card"><div class="card-head"><strong>${cls}</strong><span class="score" id="score-${i}-${j}">${scores[key(i,j)]?scores[key(i,j)]+'점':'미평가'}</span></div><div class="scale" role="group" aria-label="${name} ${cls} 점수">${[1,2,3,4,5,6].map(n=>`<button type="button" class="${scores[key(i,j)]===n?'selected':''}" aria-pressed="${scores[key(i,j)]===n}" onclick="rate(${i},${j},${n})">${n}</button>`).join('')}</div><label for="note-${i}-${j}">메모</label><textarea id="note-${i}-${j}" placeholder="평가 이유나 인상적인 부분을 작성하세요." oninput="note(${i},${j},this.value)">${esc(notes[key(i,j)]||'')}</textarea></article>`).join('')}</div></section>`).join('');update()}
function update(){const n=Object.keys(scores).filter(k=>scores[k]>=1&&scores[k]<=6).length;document.getElementById('counter').textContent=`${n} / 16`;document.getElementById('progress').style.width=(n/16*100)+'%';document.getElementById('submit').disabled=n!==16}
function rate(i,j,n){scores[key(i,j)]=n;save();const card=document.getElementById('note-'+i+'-'+j).closest('.card');card.querySelectorAll('.scale button').forEach((b,x)=>{b.classList.toggle('selected',x+1===n);b.setAttribute('aria-pressed',x+1===n)});card.querySelector('.score').textContent=n+'점';update()}
function note(i,j,v){notes[key(i,j)]=v;save()}
function sorted(i){return classes.map((name,j)=>({name,score:scores[key(i,j)]})).sort((a,b)=>b.score-a.score).map((x,idx,arr)=>({...x,rank:1+arr.filter(y=>y.score>x.score).length}))}
function renderResults(){document.getElementById('rankings').innerHTML=criteria.map(([name],i)=>`<article class="result"><h2>${i+1}. ${name}</h2>${sorted(i).map(x=>`<div class="rankrow ${x.rank===1?'top':''}"><div class="rank">${x.rank}위</div><div><strong>${x.name}</strong><div class="bar"><div style="width:${x.score/6*100}%"></div></div></div><strong>${x.score}점</strong></div>`).join('')}</article>`).join('')}
function renderMemos(){document.getElementById('memo-list').innerHTML=criteria.map(([name],i)=>`<article class="memo-group"><h2>${i+1}. ${name}</h2><div class="memo-grid">${classes.map((cls,j)=>{const value=(notes[key(i,j)]||'').trim();return `<div class="memo-item"><strong>${cls}</strong><p class="${value?'':'memo-empty'}">${value?esc(value):'작성된 메모 없음'}</p></div>`}).join('')}</div></article>`).join('')}
function show(which){if(which==='result'&&Object.keys(scores).filter(k=>scores[k]>=1&&scores[k]<=6).length!==16){document.getElementById('message').textContent='16개 문항을 모두 평가하면 결과를 볼 수 있습니다.';which='eval'}if(which==='result')renderResults();if(which==='memo')renderMemos();['eval','result','memo'].forEach(id=>{document.getElementById(id).classList.toggle('hidden',which!==id);document.getElementById('tab-'+id).classList.toggle('active',which===id)});window.scrollTo({top:0,behavior:'smooth'})}
function savePdf(which){if(which==='result'&&Object.keys(scores).filter(k=>scores[k]>=1&&scores[k]<=6).length!==16){alert('16개 문항을 모두 평가한 뒤 결과 PDF를 저장할 수 있습니다.');return;}if(which==='result')renderResults();else renderMemos();document.body.classList.remove('print-result','print-memo');document.body.classList.add('print-'+which);window.print();}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-result','print-memo'));
function copyMemos(){const txt=criteria.map(([name],i)=>`${name}\n${classes.map((cls,j)=>`${cls}: ${(notes[key(i,j)]||'').trim()||'작성된 메모 없음'}`).join('\n')}`).join('\n\n');copyText(txt)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);alert('복사했습니다.')}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('복사했습니다.')}}
function submitResults(){if(Object.keys(scores).length===16)show('result')}
function resetAll(){if(confirm('모든 평가 점수와 메모를 삭제할까요?')){scores={};notes={};save();render();show('eval')}}
async function copyResults(){const txt=criteria.map(([name],i)=>`${name}\n${sorted(i).map(x=>`${x.rank}위 ${x.name}: ${x.score}점`).join('\n')}`).join('\n\n');try{await navigator.clipboard.writeText(txt);alert('결과를 복사했습니다.')}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('결과를 복사했습니다.')}}render();
</script></body></html>
